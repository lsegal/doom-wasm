<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#120807" />
    <meta name="description" content="An original raycast shooter written in C and compiled to WebAssembly." />
    <title>WASM DOOM</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Built from scratch in C + WebAssembly</p>
          <h1>WASM DOOM</h1>
        </div>
        <button id="fullscreen" type="button">Fullscreen</button>
      </header>

      <section id="game-frame" aria-label="WASM Doom game">
        <canvas id="game" width="320" height="200" tabindex="0" aria-label="Game canvas"></canvas>
        <div id="loading" role="status">Compiling hellspace…</div>
        <div id="message" hidden></div>
      </section>

      <div class="statusbar" aria-live="polite">
        <span>HEALTH <strong id="health">100</strong></span>
        <span>FPS <strong id="fps">0</strong></span>
        <span>DEMONS <strong id="enemies">6</strong></span>
      </div>

      <footer>
        <p><kbd>WASD</kbd> move · <kbd>← →</kbd> turn · <kbd>Space</kbd> fire · click for mouse look</p>
        <p>Original engine, renderer, map, textures, and creatures. No Doom code or assets.</p>
      </footer>
    </main>
  </body>
</html>

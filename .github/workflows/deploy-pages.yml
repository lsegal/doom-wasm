name: Export Godot and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 \
            --output godot.zip \
            "${release}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output templates.tpz \
            "${release}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p .godot-bin "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q godot.zip -d .godot-bin
          unzip -q templates.tpz -d .godot-templates
          mv .godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          chmod +x .godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import Godot project
        run: .godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --import

      - name: Export web build
        run: |
          mkdir -p build/web
          .godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
            --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
